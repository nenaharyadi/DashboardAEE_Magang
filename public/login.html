
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — System Analytics AEE Unpad</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">

        <!-- Header -->
        <div class="bg-amber-800 text-white p-6 text-center">
            <h1 class="text-xl font-black tracking-tight">
                System Analytics AEE Unpad
            </h1>
            <p class="text-xs text-amber-200 mt-1">
                Silakan login sesuai peran akademik Anda
            </p>
        </div>

        <div class="p-6 space-y-5">

            <!-- Pesan Error -->
            <div
                id="alertError"
                class="hidden bg-rose-50 border border-rose-200 text-rose-700 text-xs px-3 py-2.5 rounded-lg"
                role="alert"
            ></div>

            <!-- Form Login -->
            <form id="loginForm" class="space-y-4">

                <div>
                    <label
                        for="username"
                        class="block text-xs font-semibold text-slate-700 mb-1"
                    >
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        autocomplete="username"
                        placeholder="Masukkan username..."
                        class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none"
                    >
                </div>

                <div>
                    <label
                        for="password"
                        class="block text-xs font-semibold text-slate-700 mb-1"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="current-password"
                        placeholder="Masukkan password..."
                        class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none"
                    >
                </div>

                <button
                    type="submit"
                    id="loginButton"
                    class="w-full bg-amber-700 hover:bg-amber-800 text-white font-bold text-sm py-2.5 rounded-lg shadow transition disabled:opacity-60 disabled:cursor-not-allowed"
                >
                    Masuk ke Dashboard
                </button>

            </form>

            <!-- Akun Demo -->
            <div class="border-t border-slate-100 pt-4">

                <p class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-2.5 text-center">
                    Akun Uji Coba (Klik untuk Isi Otomatis)
                </p>

                <div class="grid grid-cols-2 gap-2 text-xs">

                    <button
                        type="button"
                        onclick="fillDemo('admin', 'admin123')"
                        class="p-2 bg-slate-50 hover:bg-amber-50 border border-slate-200 hover:border-amber-300 rounded-lg text-left transition"
                    >
                        <span class="font-bold text-amber-800 block">
                            1. Admin DPSI
                        </span>
                        <span class="text-[10px] text-slate-500">
                            Semua Fakultas & Prodi
                        </span>
                    </button>

                    <button
                        type="button"
                        onclick="fillDemo('dekan_fmipa', 'dekan123')"
                        class="p-2 bg-slate-50 hover:bg-amber-50 border border-slate-200 hover:border-amber-300 rounded-lg text-left transition"
                    >
                        <span class="font-bold text-emerald-700 block">
                            2. Dekan FMIPA
                        </span>
                        <span class="text-[10px] text-slate-500">
                            Khusus Fakultas FMIPA
                        </span>
                    </button>

                    <button
                        type="button"
                        onclick="fillDemo('prodi_ti', 'prodi123')"
                        class="p-2 bg-slate-50 hover:bg-amber-50 border border-slate-200 hover:border-amber-300 rounded-lg text-left transition"
                    >
                        <span class="font-bold text-sky-700 block">
                            3. Kaprodi TI
                        </span>
                        <span class="text-[10px] text-slate-500">
                            Khusus Prodi TI
                        </span>
                    </button>

                    <button
                        type="button"
                        onclick="fillDemo('dosen_wali1', 'dosen123')"
                        class="p-2 bg-slate-50 hover:bg-amber-50 border border-slate-200 hover:border-amber-300 rounded-lg text-left transition"
                    >
                        <span class="font-bold text-rose-700 block">
                            4. Dosen Wali
                        </span>
                        <span class="text-[10px] text-slate-500">
                            Mahasiswa Bimbingan
                        </span>
                    </button>

                </div>
            </div>

        </div>
    </div>

    <script>
        // Jika sudah login, langsung arahkan ke dashboard.
        if (localStorage.getItem('aee_user')) {
            window.location.href = '/index.html';
        }

        // Mengisi username dan password akun demo.
        function fillDemo(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
        }

        // Proses login.
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const alertBox = document.getElementById('alertError');
            const loginButton = document.getElementById('loginButton');

            alertBox.classList.add('hidden');
            alertBox.innerText = '';

            loginButton.disabled = true;
            loginButton.innerText = 'Memproses...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username,
                        password
                    })
                });

                // Pastikan server memberikan respons JSON.
                let data;

                try {
                    data = await res.json();
                } catch (jsonError) {
                    throw new Error(
                        `Server memberikan respons yang tidak valid (HTTP ${res.status}). Periksa endpoint API.`
                    );
                }

                if (!res.ok) {
                    throw new Error(
                        data.message || `Terjadi kesalahan pada server (HTTP ${res.status}).`
                    );
                }

                if (data.success) {
                    // Simpan informasi user setelah login berhasil.
                    localStorage.setItem(
                        'aee_user',
                        JSON.stringify(data.user)
                    );

                    // Arahkan ke dashboard.
                    window.location.href = '/index.html';

                } else {
                    throw new Error(
                        data.message || 'Username atau password tidak valid.'
                    );
                }

            } catch (err) {
                console.error('Login error:', err);

                alertBox.innerText = err.message || 'Gagal terhubung ke server.';
                alertBox.classList.remove('hidden');

            } finally {
                loginButton.disabled = false;
                loginButton.innerText = 'Masuk ke Dashboard';
            }
        });
    </script>

</body>
</html>
