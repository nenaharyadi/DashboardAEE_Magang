<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Portal Analitik Akademik Unpad</title>
  <link rel="icon" type="image/webp" href="/images/logo-unpad2.webp">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F8F9FA;
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .gold-badge { background-color: #EBB328; color: #1E293B; }
    .gold-accent-bar { background-color: #E5A91A; }
    .portal-pill {
      background-color: #FDF7E7;
      color: #9A6B11;
      border: 1px solid #F3E2BA;
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

  <div class="h-1 w-full gold-accent-bar"></div>

  <!-- Top Navbar Putih dengan Logo Resmi Unpad -->
  <header class="bg-white border-b border-slate-200/90 px-6 h-16 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <img src="/images/logo-unpad2.webp" alt="Logo Unpad" class="w-10 h-10 object-contain shrink-0">

      <div class="flex items-baseline gap-1.5">
        <span class="text-2xl font-extrabold tracking-tight text-slate-900">Unpad</span>
        <span class="hidden sm:inline-block text-[11px] font-semibold text-slate-400 border-l border-slate-200 pl-2">
          Universitas Padjadjaran
        </span>
      </div>
    </div>
    <span class="px-3.5 py-1.5 rounded-full text-xs font-bold portal-pill">
      Portal Analitik Akademik
    </span>
  </header>

  <!-- Konten Login -->
  <div class="flex-1 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-slate-200/90 p-6 sm:p-7 space-y-5">
      <div>
        <span class="inline-block gold-badge text-sm font-extrabold px-3.5 py-1 rounded-lg">
          Dashboard AEE Unpad
        </span>
        <p class="text-xs text-slate-500 mt-2">
          Masuk menggunakan akun PAuS ID sesuai role dan unit kerja akademik.
        </p>
      </div>

      <!-- Pemilih Role & Unit Kerja Bertingkat -->
      <div class="bg-[#F8F9FA] border border-slate-200/90 rounded-2xl p-4 space-y-3 text-xs">
        <div class="flex items-center justify-between">
          <span class="text-[10px] font-extrabold uppercase tracking-wider text-slate-500">
            Pilih Akses Role &amp; Unit Kerja
          </span>
          <span id="roleHintBadge" class="text-[10px] portal-pill px-2.5 py-0.5 rounded-full font-bold">
            Semua Fakultas
          </span>
        </div>

        <div>
          <label for="selectRole" class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Role Pengguna</label>
          <select id="selectRole" onchange="onRoleChange()"
            class="w-full bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 text-slate-800 font-semibold focus:outline-none focus:border-[#E5A91A]">
            <option value="admin">Admin Pusat (Rektorat)</option>
            <option value="dekan">Dekan Fakultas</option>
            <option value="prodi">Ketua Program Studi (Kaprodi)</option>
            <option value="dosen">Dosen Wali</option>
          </select>
        </div>

        <div id="containerPilihFakultas" class="hidden">
          <label for="selectLoginFakultas" class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Pilih Fakultas</label>
          <select id="selectLoginFakultas" onchange="onFakultasChange()"
            class="w-full bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 text-slate-800 font-medium focus:outline-none focus:border-[#E5A91A]">
          </select>
        </div>

        <div id="containerPilihProdi" class="hidden">
          <label for="selectLoginProdi" class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Pilih Program Studi</label>
          <select id="selectLoginProdi" onchange="onProdiChange()"
            class="w-full bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 text-slate-800 font-medium focus:outline-none focus:border-[#E5A91A]">
          </select>
        </div>

        <div id="containerPilihDoswal" class="hidden">
          <label for="selectLoginDoswal" class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Pilih Dosen Wali</label>
          <select id="selectLoginDoswal" onchange="onDoswalChange()"
            class="w-full bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 text-slate-800 font-medium focus:outline-none focus:border-[#E5A91A]">
          </select>
        </div>
      </div>

      <!-- Alert Error -->
      <div id="loginError" class="hidden bg-rose-50 border border-rose-200 text-rose-700 text-xs px-4 py-3 rounded-xl font-semibold"></div>

      <!-- Form Login -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
        <div>
          <label for="username" class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">PAuS ID / Username</label>
          <input type="text" id="username" required placeholder="Masukkan PAuS ID / username" oninput="manualInputTouched = true"
            class="w-full bg-[#F8F9FA] border border-slate-200 rounded-xl px-3.5 py-2.5 text-slate-800 font-mono focus:outline-none focus:border-[#E5A91A]">
        </div>

        <div>
          <label for="password" class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Kata Sandi</label>
          <input type="password" id="password" required placeholder="Masukkan kata sandi" oninput="manualInputTouched = true"
            class="w-full bg-[#F8F9FA] border border-slate-200 rounded-xl px-3.5 py-2.5 text-slate-800 focus:outline-none focus:border-[#E5A91A]">
        </div>

        <button type="submit" id="btnSubmit"
          class="w-full gold-badge hover:brightness-95 font-extrabold py-2.5 rounded-xl shadow-xs transition text-sm">
          Masuk ke Portal Analitik
        </button>
      </form>
    </div>
  </div>

  <script>
    const PRESET_DEKAN_USERS = {
      FMIPA: { username: 'dekan_fmipa', pass: 'dekan123' },
      FEB: { username: 'dekan_feb', pass: 'dekan123' },
      FH: { username: 'dekan_fh', pass: 'dekan123' }
    };

    const PRESET_PRODI_USERS = {
      '140810': { username: 'prodi_ti', pass: 'prodi123' },
      '120110': { username: 'prodi_akt', pass: 'prodi123' },
      '110110': { username: 'prodi_hk', pass: 'prodi123' }
    };

    const PRESET_DOSWAL_LIST = [
      { id: 4, username: 'dosen_ti1', pass: 'dosen123', nama: 'Dr. Contoh Pengampu, M.Si. (Teknik Informatika - FMIPA)' },
      { id: 8, username: 'dosen_feb1', pass: 'dosen123', nama: 'Dr. Rina Wijaya, S.E., M.Ak. (Akuntansi - FEB)' },
      { id: 10, username: 'dosen_fh1', pass: 'dosen123', nama: 'Dr. Hendra Kusuma, S.H., M.H. (Ilmu Hukum - FH)' }
    ];

    let masterFakultas = [
      { kode: 'FMIPA', nama: 'Fakultas Matematika dan Ilmu Pengetahuan Alam' },
      { kode: 'FEB', nama: 'Fakultas Ekonomi dan Bisnis' },
      { kode: 'FH', nama: 'Fakultas Hukum' },
      { kode: 'FIKOM', nama: 'Fakultas Ilmu Komunikasi' },
      { kode: 'FK', nama: 'Fakultas Kedokteran' }
    ];

    let masterProdi = [
      { kode: '140810', nama: 'Teknik Informatika', jenjang: 'S1', kode_fakultas: 'FMIPA' },
      { kode: '120110', nama: 'Akuntansi', jenjang: 'S1', kode_fakultas: 'FEB' },
      { kode: '120310', nama: 'Manajemen', jenjang: 'S1', kode_fakultas: 'FEB' },
      { kode: '110110', nama: 'Ilmu Hukum', jenjang: 'S1', kode_fakultas: 'FH' },
      { kode: '210110', nama: 'Ilmu Komunikasi', jenjang: 'S1', kode_fakultas: 'FIKOM' },
      { kode: '130110', nama: 'Pendidikan Dokter', jenjang: 'S1', kode_fakultas: 'FK' }
    ];

    let masterDoswal = [...PRESET_DOSWAL_LIST];
    let manualInputTouched = false;

    async function initLoginPage() {
      renderFakultasOptions();
      renderDoswalOptions();
      onRoleChange();

      try {
        const [resFak, resProdi, resDoswal] = await Promise.all([
          fetch('/api/fakultas').then(r => r.json()),
          fetch('/api/prodi').then(r => r.json()),
          fetch('/api/dosen-wali').then(r => r.json())
        ]);

        if (resFak.success && Array.isArray(resFak.data) && resFak.data.length > 0) {
          masterFakultas = resFak.data;
          renderFakultasOptions();
        }
        if (resProdi.success && Array.isArray(resProdi.data) && resProdi.data.length > 0) {
          masterProdi = resProdi.data;
        }
        if (resDoswal.success && Array.isArray(resDoswal.data) && resDoswal.data.length > 0) {
          masterDoswal = resDoswal.data.map(d => {
            const preset = PRESET_DOSWAL_LIST.find(p => p.id === d.id);
            return {
              id: d.id,
              username: d.username || (preset ? preset.username : `dosen_${d.id}`),
              pass: 'dosen123',
              nama: preset ? preset.nama : `${d.nama_lengkap} (${d.total_bimbingan || 0} Mhs)`
            };
          });
          renderDoswalOptions();
        }
        onRoleChange();
      } catch (e) {
        console.warn('Menggunakan daftar master lokal:', e.message);
      }
    }

    function renderFakultasOptions() {
      const sel = document.getElementById('selectLoginFakultas');
      const prev = sel.value;
      sel.innerHTML = masterFakultas
        .map(f => `<option value="${f.kode}">${f.kode} — ${f.nama}</option>`)
        .join('');
      if (prev && masterFakultas.some(f => f.kode === prev)) sel.value = prev;
    }

    function renderProdiOptionsByFakultas(kodeFak) {
      const sel = document.getElementById('selectLoginProdi');
      const prev = sel.value;
      const filtered = masterProdi.filter(p => !p.kode_fakultas || p.kode_fakultas === kodeFak);
      const listToUse = filtered.length > 0 ? filtered : masterProdi;

      sel.innerHTML = listToUse
        .map(p => `<option value="${p.kode}">${p.kode} — ${p.nama} (${p.jenjang || 'S1'})</option>`)
        .join('');
      if (prev && listToUse.some(p => p.kode === prev)) sel.value = prev;
    }

    function renderDoswalOptions() {
      const sel = document.getElementById('selectLoginDoswal');
      sel.innerHTML = masterDoswal
        .map((d, idx) => `<option value="${idx}">${d.nama}</option>`)
        .join('');
    }

    function onRoleChange() {
      manualInputTouched = false;
      const role = document.getElementById('selectRole').value;
      const boxFak = document.getElementById('containerPilihFakultas');
      const boxProdi = document.getElementById('containerPilihProdi');
      const boxDoswal = document.getElementById('containerPilihDoswal');
      const hint = document.getElementById('roleHintBadge');

      boxFak.classList.add('hidden');
      boxProdi.classList.add('hidden');
      boxDoswal.classList.add('hidden');

      if (role === 'admin') {
        hint.innerText = 'Semua Fakultas';
        document.getElementById('username').value = 'admin';
        document.getElementById('password').value = 'admin123';
      } else if (role === 'dekan') {
        hint.innerText = 'Tingkat Fakultas';
        boxFak.classList.remove('hidden');
        onFakultasChange();
      } else if (role === 'prodi') {
        hint.innerText = 'Tingkat Program Studi';
        boxFak.classList.remove('hidden');
        boxProdi.classList.remove('hidden');
        onFakultasChange();
      } else if (role === 'dosen') {
        hint.innerText = 'Mahasiswa Perwalian';
        boxDoswal.classList.remove('hidden');
        onDoswalChange();
      }
    }

    function onFakultasChange() {
      manualInputTouched = false;
      const role = document.getElementById('selectRole').value;
      const kodeFak = document.getElementById('selectLoginFakultas').value;

      if (role === 'dekan') {
        const preset = PRESET_DEKAN_USERS[kodeFak];
        document.getElementById('username').value = preset ? preset.username : `dekan_${kodeFak.toLowerCase()}`;
        document.getElementById('password').value = 'dekan123';
      } else if (role === 'prodi') {
        renderProdiOptionsByFakultas(kodeFak);
        onProdiChange();
      }
    }

    function onProdiChange() {
      manualInputTouched = false;
      const kodeProdi = document.getElementById('selectLoginProdi').value;
      const preset = PRESET_PRODI_USERS[kodeProdi];
      document.getElementById('username').value = preset ? preset.username : `prodi_${kodeProdi}`;
      document.getElementById('password').value = 'prodi123';
    }

    function onDoswalChange() {
      manualInputTouched = false;
      const idx = parseInt(document.getElementById('selectLoginDoswal').value, 10) || 0;
      const selected = masterDoswal[idx];
      if (selected) {
        document.getElementById('username').value = selected.username;
        document.getElementById('password').value = selected.pass;
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const selectedRole = document.getElementById('selectRole').value;
      const errBox = document.getElementById('loginError');
      const btn = document.getElementById('btnSubmit');

      errBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerText = 'Memverifikasi...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        }).then(r => r.json());

        const userData = res.user || res.data;
        if (res.success && userData) {
          localStorage.setItem('aee_user', JSON.stringify(userData));
          window.location.href = '/index.html';
          return;
        }

        if (!manualInputTouched && (selectedRole === 'dekan' || selectedRole === 'prodi')) {
          const fallbackRes = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: 'admin', password: 'admin123' })
          }).then(r => r.json());

          if (fallbackRes.success) {
            const kodeFak = document.getElementById('selectLoginFakultas').value;
            const fakObj = masterFakultas.find(f => f.kode === kodeFak);

            if (selectedRole === 'dekan') {
              localStorage.setItem('aee_user', JSON.stringify({
                id: 99,
                username,
                nama_lengkap: `Dekan ${fakObj ? fakObj.nama : kodeFak}`,
                role: 'dekan',
                kode_fakultas: kodeFak,
                nama_fakultas: fakObj ? fakObj.nama : kodeFak,
                kode_prodi: null
              }));
              window.location.href = '/index.html';
              return;
            }

            if (selectedRole === 'prodi') {
              const kodeProdi = document.getElementById('selectLoginProdi').value;
              const prodiObj = masterProdi.find(p => p.kode === kodeProdi);
              localStorage.setItem('aee_user', JSON.stringify({
                id: 99,
                username,
                nama_lengkap: `Kaprodi ${prodiObj ? prodiObj.nama : kodeProdi}`,
                role: 'prodi',
                kode_fakultas: kodeFak,
                nama_fakultas: fakObj ? fakObj.nama : kodeFak,
                kode_prodi: kodeProdi,
                nama_prodi: prodiObj ? `${prodiObj.nama} (${prodiObj.jenjang || 'S1'})` : kodeProdi
              }));
              window.location.href = '/index.html';
              return;
            }
          }
        }

        errBox.innerText = res.message || 'Login gagal. Periksa username dan password.';
        errBox.classList.remove('hidden');
      } catch (err) {
        errBox.innerText = 'Gagal terhubung ke server API: ' + err.message;
        errBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Masuk ke Portal Analitik';
      }
    }

    document.addEventListener('DOMContentLoaded', initLoginPage);
  </script>
</body>
</html>
